name: Pharma News Digest

on:
  schedule:
    # 毎朝 7:00 JST = 前日 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "送信せず HTML を artifact に出力するだけ (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: pharma-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharma_news_digest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pharma_news_digest/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily digest
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS || 'takuya.inoue@novartis.com' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Upload digest HTML (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: pharma_news_digest/out.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated read-state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          git add pharma_news_digest/state/seen_ids.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pharma digest read-state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
