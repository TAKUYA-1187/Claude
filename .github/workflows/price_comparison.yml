name: Price Comparison Update

on:
  schedule:
    # JST 06:00 = UTC 21:00 (前日)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "件数制限 (テスト用、空なら全件)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: price_comparison
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "price_comparison/requirements.txt"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run price comparison
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          ENABLED_SHOPS: ${{ vars.ENABLED_SHOPS || '買取商店,ウィキ' }}
          AMAZON_REFERRAL_FEE_RATE: ${{ vars.AMAZON_REFERRAL_FEE_RATE || '0.10' }}
          AMAZON_FBA_FEE: ${{ vars.AMAZON_FBA_FEE || '500' }}
          RAKUTEN_FEE_RATE: ${{ vars.RAKUTEN_FEE_RATE || '0.10' }}
          YAHOO_FEE_RATE: ${{ vars.YAHOO_FEE_RATE || '0.08' }}
          SHIPPING_COST: ${{ vars.SHIPPING_COST || '600' }}
          MIN_PROFIT: ${{ vars.MIN_PROFIT || '500' }}
          MIN_PROFIT_RATE: ${{ vars.MIN_PROFIT_RATE || '0.15' }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python -m src.main --limit "$LIMIT"
          else
            python -m src.main
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profitable-${{ github.run_id }}
          path: price_comparison/data/output/
          retention-days: 30

      - name: Commit latest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          git add price_comparison/data/output/profitable_latest.csv \
                  price_comparison/data/output/profitable_latest.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profitable products list [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
