name: Price Comparison Update

on:
  schedule:
    # JST 11:00 = UTC 02:00, JST 18:00 = UTC 09:00
    - cron: "0 2,9 * * *"
  push:
    branches:
      - claude/resale-profit-analysis-nhbnaz
    paths:
      - "price_comparison/src/**"
      - "price_comparison/scripts/**"
      - "price_comparison/ledger/**"
      - "price_comparison/.refresh"
      - ".github/workflows/price_comparison.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "件数制限 (テスト用、空なら全件)"
        required: false
        default: ""
      mode:
        description: "利益判定ルート"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - buyback
          - amazon
      collect:
        description: "ECサイトから売れ筋JANを収集して母集団に加える"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: price-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: price_comparison
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: price_comparison/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (ledger / recovery)
        run: |
          python -m unittest tests.test_recovery
          cd ledger && python -m unittest test_ledger test_import

      - name: Fetch Kaitorishouten new-item buyback prices and match Yahoo (recovery 2026-11-28)
        working-directory: price_comparison/scripts
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          SHIPPING_COST: ${{ vars.SHIPPING_COST || '600' }}
          POINT_RATE: ${{ vars.POINT_RATE || '0.05' }}
          YAHOO_DAILY_BUDGET: ${{ vars.YAHOO_DAILY_BUDGET || '5000' }}
          YAHOO_RUN_BUDGET: ${{ vars.YAHOO_RUN_BUDGET || '2000' }}
        run: python kaitori_catalog.py

      - name: Run price comparison
        continue-on-error: true   # 旧経路（OneDrive・楽天・Amazon）は未設定項目が多いため、失敗しても買取ルートを止めない
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          ENABLED_SHOPS: ${{ vars.ENABLED_SHOPS || '買取商店,ウィキ' }}
          AMAZON_REFERRAL_FEE_RATE: ${{ vars.AMAZON_REFERRAL_FEE_RATE || '0.10' }}
          AMAZON_FBA_FEE: ${{ vars.AMAZON_FBA_FEE || '500' }}
          AMAZON_FEE_TAX_RATE: ${{ vars.AMAZON_FEE_TAX_RATE || '0.10' }}
          AMAZON_INBOUND_COST: ${{ vars.AMAZON_INBOUND_COST || '200' }}
          RAKUTEN_FEE_RATE: ${{ vars.RAKUTEN_FEE_RATE || '0.10' }}
          YAHOO_FEE_RATE: ${{ vars.YAHOO_FEE_RATE || '0.08' }}
          SHIPPING_COST: ${{ vars.SHIPPING_COST || '600' }}
          MIN_PROFIT: ${{ vars.MIN_PROFIT || '500' }}
          MIN_PROFIT_RATE: ${{ vars.MIN_PROFIT_RATE || '0.15' }}
          COLLECT_KEYWORDS: ${{ vars.COLLECT_KEYWORDS || '' }}
          COLLECT_YAHOO_GENRES: ${{ vars.COLLECT_YAHOO_GENRES || '' }}
          COLLECT_PAGES: ${{ vars.COLLECT_PAGES || '3' }}
        run: |
          ARGS="--mode ${{ github.event.inputs.mode || 'both' }}"
          if [ "${{ github.event.inputs.collect || 'true' }}" = "true" ]; then
            ARGS="$ARGS --collect"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python -m src.main $ARGS

      - name: Import into product ledger (stale data is refused)
        working-directory: price_comparison/ledger
        run: |
          set +e
          python import_kaitori_report.py \
            --report ../data/output/kaitorishouten_all_latest.csv \
            --ledger-dir ../ledger_data \
            --run-date "$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          code=$?
          # 2 = データが古いため取込中止（正常な安全停止）。1 = 要確認行あり（台帳は更新済み）
          if [ $code -ne 0 ] && [ $code -ne 1 ] && [ $code -ne 2 ]; then exit $code; fi
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profitable-${{ github.run_id }}
          path: |
            price_comparison/data/output/
            price_comparison/data/collected/
          retention-days: 30

      - name: Commit latest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          for f in price_comparison/data/output/profitable_latest.csv \
                   price_comparison/data/output/profitable_latest.json \
                   price_comparison/data/output/amazon_profitable_latest.csv \
                   price_comparison/data/output/amazon_profitable_latest.json \
                   price_comparison/data/output/run_summary.json \
                   price_comparison/data/output/kaitorishouten_all_latest.csv \
                   price_comparison/data/output/kaitorishouten_profitable_latest.csv \
                   price_comparison/data/output/kaitorishouten_catalog_latest.csv \
                   price_comparison/data/collected/collected_latest.csv \
                   price_comparison/ledger_data/master.csv \
                   price_comparison/ledger_data/history.csv \
                   price_comparison/ledger_data/excluded.csv \
                   price_comparison/data/output/kaitori_run_status.json \
                   price_comparison/data/state/yahoo_usage.json \
                   price_comparison/data/state/yahoo_price_cache.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profitable products list [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Fail the run if data acquisition failed
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("data/output/kaitori_run_status.json", encoding="utf-8"))
          print("STATUS:", s["status"], "/", " / ".join(s.get("reasons") or []))
          sys.exit(1 if s["status"] == "取得失敗" else 0)
          PY
