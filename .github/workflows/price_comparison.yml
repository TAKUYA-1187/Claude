name: Price Comparison Update

on:
  schedule:
    # JST 11:00 = UTC 02:00, JST 18:00 = UTC 09:00
    - cron: "0 2,9 * * *"
  push:
    branches:
      - claude/resale-profit-analysis-nhbnaz
    paths:
      - "price_comparison/src/**"
      - ".github/workflows/price_comparison.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "件数制限 (テスト用、空なら全件)"
        required: false
        default: ""
      mode:
        description: "利益判定ルート"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - buyback
          - amazon
      collect:
        description: "ECサイトから売れ筋JANを収集して母集団に加える"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: price_comparison
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: price_comparison/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price comparison
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          ENABLED_SHOPS: ${{ vars.ENABLED_SHOPS || '買取商店,ウィキ' }}
          AMAZON_REFERRAL_FEE_RATE: ${{ vars.AMAZON_REFERRAL_FEE_RATE || '0.10' }}
          AMAZON_FBA_FEE: ${{ vars.AMAZON_FBA_FEE || '500' }}
          AMAZON_FEE_TAX_RATE: ${{ vars.AMAZON_FEE_TAX_RATE || '0.10' }}
          AMAZON_INBOUND_COST: ${{ vars.AMAZON_INBOUND_COST || '200' }}
          RAKUTEN_FEE_RATE: ${{ vars.RAKUTEN_FEE_RATE || '0.10' }}
          YAHOO_FEE_RATE: ${{ vars.YAHOO_FEE_RATE || '0.08' }}
          SHIPPING_COST: ${{ vars.SHIPPING_COST || '600' }}
          MIN_PROFIT: ${{ vars.MIN_PROFIT || '500' }}
          MIN_PROFIT_RATE: ${{ vars.MIN_PROFIT_RATE || '0.15' }}
          COLLECT_KEYWORDS: ${{ vars.COLLECT_KEYWORDS || '' }}
          COLLECT_YAHOO_GENRES: ${{ vars.COLLECT_YAHOO_GENRES || '' }}
          COLLECT_PAGES: ${{ vars.COLLECT_PAGES || '3' }}
        run: |
          ARGS="--mode ${{ github.event.inputs.mode || 'both' }}"
          if [ "${{ github.event.inputs.collect || 'true' }}" = "true" ]; then
            ARGS="$ARGS --collect"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python -m src.main $ARGS

      - name: Match against Kaitorishouten buyback prices
        working-directory: price_comparison/scripts
        env:
          SHIPPING_COST: ${{ vars.SHIPPING_COST || '600' }}
        run: python kaitori_catalog.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profitable-${{ github.run_id }}
          path: |
            price_comparison/data/output/
            price_comparison/data/collected/
          retention-days: 30

      - name: Commit latest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          for f in price_comparison/data/output/profitable_latest.csv \
                   price_comparison/data/output/profitable_latest.json \
                   price_comparison/data/output/amazon_profitable_latest.csv \
                   price_comparison/data/output/amazon_profitable_latest.json \
                   price_comparison/data/output/run_summary.json \
                   price_comparison/data/output/kaitorishouten_all_latest.csv \
                   price_comparison/data/output/kaitorishouten_profitable_latest.csv \
                   price_comparison/data/output/kaitorishouten_catalog_latest.csv \
                   price_comparison/data/collected/collected_latest.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profitable products list [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
