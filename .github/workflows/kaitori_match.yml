name: Kaitorishouten Match

on:
  push:
    branches:
      - claude/resale-profit-analysis-nhbnaz
    paths:
      - "price_comparison/scripts/kaitori_scraper.py"
      - ".github/workflows/kaitori_match.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "照会件数の上限 (テスト用、空なら全件)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Scrape and match
        env:
          SCRAPE_LIMIT: ${{ github.event.inputs.limit || '0' }}
          SHIPPING_COST: ${{ vars.SHIPPING_COST || '600' }}
        run: python price_comparison/scripts/kaitori_scraper.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaitori-match-${{ github.run_id }}
          path: |
            price_comparison/data/output/kaitorishouten_*.csv
            price_comparison/data/recon/sample_result_*.html
          retention-days: 30

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git add -f price_comparison/data/output/kaitorishouten_*.csv price_comparison/data/recon/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: kaitorishouten match results [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
