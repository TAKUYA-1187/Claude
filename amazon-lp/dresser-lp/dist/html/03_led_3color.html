<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><title>03 3色調光LED</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2000px;height:2000px;background:#fff}
.stage{width:2000px;height:2000px;position:relative;overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;color:#2F2A25;
  -webkit-font-smoothing:antialiased}
.dresser{display:block;width:100%;height:100%}

/* --- テキスト系 --- */
.eyebrow{font-size:40px;font-weight:700;letter-spacing:.18em;color:#B8935E}
.h1{font-size:132px;font-weight:900;line-height:1.13;letter-spacing:-.015em}
.h2{font-size:96px;font-weight:900;line-height:1.18;letter-spacing:-.01em}
.lead{font-size:40px;font-weight:500;line-height:1.62;color:#6B6156}
.hl{color:#B8935E}
.mark{background:linear-gradient(transparent 62%, #F2E7D5 62%)}

/* --- 帯・囲み --- */
.rule{height:5px;width:120px;background:#B8935E;border-radius:3px}
.chip{display:inline-flex;align-items:center;gap:16px;background:#2F2A25;color:#fff;
  border-radius:999px;padding:18px 44px;font-size:38px;font-weight:700;letter-spacing:.04em}
.chip.g{background:#B8935E}
.chip.o{background:#fff;color:#2F2A25;border:4px solid #E4DACE}
.card{background:#fff;border:4px solid #E4DACE;border-radius:36px}
.num{font-family:'Noto Serif JP',serif;font-weight:900;color:#D9BC8E;line-height:.82}

/* --- 下部スペックバー --- */
.specbar{position:absolute;left:0;right:0;bottom:0;height:132px;background:#2F2A25;
  display:flex;align-items:center;justify-content:center;gap:70px;color:#fff}
.specbar b{font-size:44px;font-weight:900;letter-spacing:.02em}
.specbar span{font-size:34px;font-weight:500;opacity:.72}
.specbar i{width:3px;height:52px;background:rgba(255,255,255,.26);display:block}
.note{font-size:26px;color:#9C9186;line-height:1.6}

.stage{background:linear-gradient(175deg,#FFFFFF 0%, #FBF7F2 58%, #F3ECE3 100%)}
.top{position:absolute;left:0;right:0;top:110px;text-align:center}
.top .eyebrow{margin-bottom:24px}
.top .h2{margin-bottom:30px}
.top .lead{font-size:38px}
.cards{position:absolute;left:96px;right:96px;top:600px;display:flex;gap:44px}
.c{flex:1;background:#fff;border-radius:40px;padding:56px 40px 48px;text-align:center;
   border:3px solid rgba(228,218,206,.9);box-shadow:0 18px 44px rgba(120,100,74,.10)}
.mw{width:100%;height:466px;margin-bottom:30px}
.mv{width:100%;height:100%}
.k{display:inline-block;background:#F2E7D5;color:#B8935E;font-size:29px;font-weight:900;
   letter-spacing:.1em;border-radius:999px;padding:12px 30px;margin-bottom:24px}
.c b{display:block;font-size:56px;font-weight:900;margin-bottom:20px;letter-spacing:-.01em}
.c p{font-size:31px;font-weight:500;color:#6B6156;line-height:1.62}
.dim{position:absolute;left:96px;right:96px;bottom:210px;background:#2F2A25;color:#fff;
  border-radius:34px;padding:46px 60px;display:flex;align-items:center;gap:46px}
.dim .bt{font-size:46px;font-weight:900;white-space:nowrap}
.dim .bar{flex:1;height:26px;border-radius:13px;
  background:linear-gradient(90deg,#4A423A 0%, #8C7350 34%, #D8B47E 68%, #FFF0D2 100%);position:relative}
.dim .bar::after{content:'';position:absolute;right:-2px;top:-9px;width:44px;height:44px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.28)}
.dim .bs{font-size:32px;font-weight:500;opacity:.78;white-space:nowrap}
</style></head>
<body><div class="stage">
<div class="top">
  <div class="eyebrow">3 COLOR  ×  DIMMABLE  LED</div>
  <div class="h2">顔色まで、ちゃんと見える。</div>
  <div class="lead">シーンに合わせて選べる<span class="hl">3色の光</span>。タッチひとつで切り替わります。</div>
</div>
<div class="cards">
  
   <div class="c">
     <div class="mw">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" class="mv">
    <defs>
      <linearGradient id="mga" x1=".1" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#F2F7FA"/><stop offset=".5" stop-color="#FBFDFE"/>
        <stop offset="1" stop-color="#DCE7EE"/>
      </linearGradient>
      <filter id="fga" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <rect x="14" y="10" width="72" height="96" rx="5" fill="#FFC069" opacity=".55" filter="url(#fga)"/>
    <rect x="16" y="12" width="68" height="92" rx="4" fill="#FFC069" opacity=".85"/>
    <rect x="21" y="17" width="58" height="82" rx="2" fill="url(#mga)"/>
    <rect x="16" y="12" width="68" height="92" rx="4" fill="none" stroke="#CFC6B8" stroke-width="0.7"/>
    <path d="M26 97 L46 19 L54 19 L34 97 Z" fill="#fff" opacity=".42"/>
    <path d="M58 97 L69 19 L73 19 L62 97 Z" fill="#fff" opacity=".24"/>
    <circle cx="50" cy="110" r="3.4" fill="#fff" stroke="#E4DACE" stroke-width="1"/>
    <circle cx="50" cy="110" r="1.2" fill="#D9BC8E"/>
  </svg></div>
     <div class="k">電球色 3000K</div>
     <b>くつろぐ夜に</b>
     <p>やわらかな暖色。<br>就寝前のスキンケアに。</p>
   </div>
  
   <div class="c">
     <div class="mw">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" class="mv">
    <defs>
      <linearGradient id="mgb" x1=".1" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#F2F7FA"/><stop offset=".5" stop-color="#FBFDFE"/>
        <stop offset="1" stop-color="#DCE7EE"/>
      </linearGradient>
      <filter id="fgb" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <rect x="14" y="10" width="72" height="96" rx="5" fill="#FFE7BC" opacity=".75" filter="url(#fgb)"/>
    <rect x="16" y="12" width="68" height="92" rx="4" fill="#FFE7BC" opacity=".85"/>
    <rect x="21" y="17" width="58" height="82" rx="2" fill="url(#mgb)"/>
    <rect x="16" y="12" width="68" height="92" rx="4" fill="none" stroke="#CFC6B8" stroke-width="0.7"/>
    <path d="M26 97 L46 19 L54 19 L34 97 Z" fill="#fff" opacity=".42"/>
    <path d="M58 97 L69 19 L73 19 L62 97 Z" fill="#fff" opacity=".24"/>
    <circle cx="50" cy="110" r="3.4" fill="#fff" stroke="#E4DACE" stroke-width="1"/>
    <circle cx="50" cy="110" r="1.2" fill="#D9BC8E"/>
  </svg></div>
     <div class="k">昼白色 4500K</div>
     <b>ふだんのメイクに</b>
     <p>自然光に近い明るさ。<br>色ムラのない仕上がりに。</p>
   </div>
  
   <div class="c">
     <div class="mw">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" class="mv">
    <defs>
      <linearGradient id="mgc" x1=".1" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#F2F7FA"/><stop offset=".5" stop-color="#FBFDFE"/>
        <stop offset="1" stop-color="#DCE7EE"/>
      </linearGradient>
      <filter id="fgc" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <rect x="14" y="10" width="72" height="96" rx="5" fill="#CFE4FF" opacity=".60" filter="url(#fgc)"/>
    <rect x="16" y="12" width="68" height="92" rx="4" fill="#CFE4FF" opacity=".85"/>
    <rect x="21" y="17" width="58" height="82" rx="2" fill="url(#mgc)"/>
    <rect x="16" y="12" width="68" height="92" rx="4" fill="none" stroke="#CFC6B8" stroke-width="0.7"/>
    <path d="M26 97 L46 19 L54 19 L34 97 Z" fill="#fff" opacity=".42"/>
    <path d="M58 97 L69 19 L73 19 L62 97 Z" fill="#fff" opacity=".24"/>
    <circle cx="50" cy="110" r="3.4" fill="#fff" stroke="#E4DACE" stroke-width="1"/>
    <circle cx="50" cy="110" r="1.2" fill="#D9BC8E"/>
  </svg></div>
     <div class="k">昼光色 6000K</div>
     <b>細部チェックに</b>
     <p>クリアな白色光。<br>アイメイクや眉の確認に。</p>
   </div>
</div>
<div class="dim">
  <div class="bt">明るさ 無段階調光</div>
  <div class="bar"></div>
  <div class="bs">長押しでお好みの明るさに</div>
</div>
<div class="specbar">
  <b>3色調光 LED</b><i></i><span>タッチスイッチ</span><i></i>
  <span>省エネLED</span><i></i><span>ミラー幅 約38cm</span>
</div></div></body></html>
