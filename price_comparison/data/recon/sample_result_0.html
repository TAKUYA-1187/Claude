            left: 0;

            height: 12px;
            text-align: center;

    <script>
        //eccube_option.productsClassOptions = {

        $(function() {
            $('.do-product-list1').on('click', function(e) {
                e.preventDefault();

                $('#last_category_id').val($('#last_category').val());
                var url = $(this).data('url');

				if($("#search_name").val()){
					 var $form = $("#product_search_form");
					 //$form.attr('action', url);
					 var current_page = $("#current_page").val();
					 //var url = $form.attr('action');
					 if(current_page){
						  url = url + '?pageno=' + current_page;
					 }
					 $.ajax({
						url: url,
						type: $form.attr('method'),
						data: $form.serialize(),
					}).done(function(data) {
						$('#search-content').html(data);
					});
					return;
				}else if($('#last_category_id').val()){
					 var $form = $("#product_search_form");
					 //$form.attr('action', url);
					 var current_page = $("#current_page").val();
					 //var url = $form.attr('action');
					 if(current_page){
						  url = url + '?pageno=' + current_page;
					 }
					 $.ajax({
						url: url,
						type: $form.attr('method'),
						data: $form.serialize(),
					}).done(function(data) {
						$('#search-content').html(data);
					});
					return;
				}
                // 商品一覧を更新する
                $.ajax({
                    url: url,
                    type: 'GET',
                }).done(function(data) {
                    $('#search-content').html(data);
                });
            });

            $('.product_collapse').on('click', function(e) {
                var id = $(this).attr('id');
				//console.log(id);
				if ($('.'+id).hasClass("hidden") ) {
					$('.'+id).removeClass("hidden");
				} else {
					$('.'+id).addClass("hidden");
				}
            });

            $(".rankoption-close").on('click', function(){
                $("[id^='new-rankoption-']").removeClass("open");
                $("[id^='old-rankoption-']").removeClass("open");
            });

            $(".form-check-input").on('click', function(){
                var value = $(this).val();
				//console.log(value);
                var name = $(this).attr('name');
				console.log('click:'+name);
                if (name =="ranktype") {
                    var parent = $(this).parents('.rankoption_collapse');
                    var id = parent.attr('id');
					//console.log(id);
                    //var child = $('#'+id).find('.rankoption_select_1');
                    //var child2 = $('#'+id).find('.rankoption_select_2');
                    var child = $('#new-'+id);
                    var child2 = $('#old-'+id);

                    if ('1' === value) {
						if (child.hasClass("open")) {
                            $("[id^='new-rankoption-']").removeClass("open");
                            $("[id^='old-rankoption-']").removeClass("open");
							//child.removeClass("open");
						} else {
                            $("[id^='new-rankoption-']").removeClass("open");
                            $("[id^='old-rankoption-']").removeClass("open");
							child.addClass("open");
						}
                    }
                    if ('2' === value) {
						if (child2.hasClass("open")) {
                            $("[id^='new-rankoption-']").removeClass("open");
                            $("[id^='old-rankoption-']").removeClass("open");
							//child2.removeClass("open");
						} else {
                            $("[id^='new-rankoption-']").removeClass("open");
                            $("[id^='old-rankoption-']").removeClass("open");
							child2.addClass("open");
						}
                    }
                }
			});

            $(".form-check-input").change(function(){
                var value = $(this).val();
				//console.log(value);
                var name = $(this).attr('name');
				console.log("change:"+name);

				var target = "";
                if (name =="option_new_id1") target = "option_new_id";
                if (name =="option_old_id1") target = "option_old_id";

                if (name =="option_new_id1" || name =="option_old_id1") {
					var $parent = $(this).parents('.product-class-option-set');
                    var product_class_id = $parent.attr('data-class-id');
					var $form = $("#productForm"+product_class_id)
					var $sele1 = $(this);
					var $sele2 = $("#"+ target +"2"+product_class_id);

					if (!$sele2.length) {
						// 規格1のみの場合
						console.log('規格1のみ');
						eccube_option.setClassOptions($form, product_class_id, $sele1.val(), null, target);
					} else {
						// 規格2ありの場合
						console.log('規格2あり');
						eccube_option.setClassOptions($form, product_class_id, $sele1, $sele2, target);
					}
				}

                if (name =="ranktype") {
                    var parent = $(this).parents('.rankoption_collapse');
                    var id = parent.attr('id');
					//console.log(id);
                    //var child = $('#'+id).find('.rankoption_select_1');
                    //var child2 = $('#'+id).find('.rankoption_select_2');
                    var child = $('#new-'+id);
                    var child2 = $('#old-'+id);
					

                    if ('1' === value) {
                        //child.removeClass("hidden");
                        //child2.addClass("hidden");
						child.addClass("open");
						child2.removeClass("open");
                    }
                    if ('2' === value) {
                        //child.addClass("hidden");
                        //child2.removeClass("hidden");
                        child.removeClass("open");
                        child2.addClass("open");
                    }
                }
				return;

                var $form = $(this).parents('form');
                var url = $form.data('calc-url');
                //console.log("action:" + url);
                //console.log("method:" + $form.attr('method'));
                //console.log("data:" + $form.serialize());
                $.ajax({
                    url: url,
                    type: $form.attr('method'),
                    data: $form.serialize(),
                    dataType: 'json',
                    beforeSend: function(xhr, settings) {
                    }
                }).done(function(data) {
                    // レスポンス内のメッセージをalertで表示
                    if (data.done) {
						if (data.price) {
							var obj = $form.find('.item-price-adjusted');
							obj.html(data.price + "円");
						}
                    } else {
                        $.each(data.messages, function() {
                            $('#ec-modal-header').html(this);
                        });
                        $('#ec-modal-checkbox').prop('checked', true);
                    }


                }).fail(function(data) {
                }).always(function(data) {
                });

            });

            $('.add_favorite').on('click', function(e) {
                e.preventDefault();
                var url = $(this).data('url');
                var id = $(this).data('id');
                $.ajax({
                    url: url,
                    type: 'POST',
                    dataType: 'json',
                    beforeSend: function(xhr, settings) {
                        // Buttonを無効にする
                        $('.add_favorite').prop('disabled', true);
                    }
                }).done(function(data) {
                    // レスポンス内のメッセージをalertで表示
                    $.each(data.messages, function() {
						if (data.done) {
							$('.add_favorite_'+id).addClass('hidden');
							$('.remove_favorite_'+id).removeClass('hidden');
						} else {
							alert(this);
						}
                    });
                }).fail(function(data) {
                    //alert('お気に入りへの追加に失敗しました。');
                }).always(function(data) {
                    // Buttonを有効にする
                    $('.add_favorite').prop('disabled', false);
                });
            });

            $('.remove_favorite').on('click', function(e) {
                e.preventDefault();
                var url = $(this).data('url');
				var id = $(this).data('id');
                $.ajax({
                    url: url,
                    type: 'DELETE',
                    dataType: 'json',
                    beforeSend: function(xhr, settings) {
                        // Buttonを無効にする
                        $('.remove_favorite').prop('disabled', true);
                    }
                }).done(function(data) {
                    // レスポンス内のメッセージをalertで表示
                    $.each(data.messages, function() {
						if (data.done) {
							$('.add_favorite_'+id).removeClass('hidden');
							$('.remove_favorite_'+id).addClass('hidden');
						} else {
							alert(this);
						}
                    });
                }).fail(function(data) {
                    //alert('お気に入りへの追加に失敗しました。');
                }).always(function(data) {
                    // Buttonを有効にする
                    $('.remove_favorite').prop('disabled', false);
                });
            });

            $('.add-product').on('click', function(e) {
                e.preventDefault();
                var id = $(this).data('id');
                console.log("id:" + id);
                var url = $(this).data('url');
                console.log("url:" + url);
				if(id){
					url = url + '?productclass_id=' + id;
	                // 商品一覧を更新する
					 $.ajax({
						url: url,
						type: 'GET',
					}).done(function(data) {
						$('#search-content').html(data);
					});
					return;
				}
            });

            $('.add-cart').on('click', function(e) {
                var id = $(this).data('cartid');
                //console.log("id:" + id);
                var $form = $('#productForm'+id);

                //console.log("action:" + $form.attr('action'));
                //console.log("method:" + $form.attr('method'));
                //console.log("data:" + $form.serialize());
				var params = $('#ex-product-' + id + ' :input');
				//console.log("data2:" + params.serialize());

                // 個数フォームのチェック
                var $quantity = $form.parent().find('.quantity');
				//console.log("quantity:"+$quantity.val());
                if ($quantity.val() < 1) {
					alert('数量は、1以上で入力してください。');
					return true;
